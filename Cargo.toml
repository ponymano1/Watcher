[package]
name = "web3-rust-watcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["sync", "time", "macros", "rt", "rt-multi-thread", "signal"] }
tokio-util = "0.7.18"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
async-trait = "0.1"
serde_json = "1.0.150"
